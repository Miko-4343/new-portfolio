<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Korea Exchange | under construction</title>
  <style>
    :root { --bg:#f6f5f0; --fg:#1b1d1f; --muted:#5c6168; --line:#d6d3c8; --accent:#0b7a4b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#d7dde5; --muted:#8b949e; --line:#262c34; --accent:#3fb950; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font: 15px/1.75 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      padding: 24px;
    }
    main { width: 100%; max-width: 560px; border: 1px solid var(--line); padding: 28px; }
    .ps { color: var(--accent); margin-right: 8px; }
    .muted { color: var(--muted); }
    .cursor {
      display: inline-block; width: .55em; height: 1em; background: var(--accent);
      vertical-align: -0.15em; margin-left: 4px; animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div><span class="ps">$</span>ls ~/korea-exchange</div>
    <div class="muted">ls: cannot access: korean exchange is under construction<span class="cursor"></span></div>
    <p style="margin-top:24px">My korean exchange story will be published soon.</p>
    <p class="muted" style="margin:0">&larr; <a href="https://kosmiha.eu">back to kosmiha.eu</a></p>
  </main>
</body>
</html>
