version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    environment:
      - PORT=3000
      - RESEND_KEY=${RESEND_KEY}
    networks:
      - app-net

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx main configuration
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      # SSL Certificates
      - ./nginx/ssl:/etc/nginx/ssl
      # Static Frontends
      - ./portfolio/dist:/usr/share/nginx/html
      - ./gallery:/usr/share/nginx/gallery
      - ./korea-exchange:/usr/share/nginx/korea-exchange
    depends_on:
      - backend
    networks:
      - app-net

networks:
  app-net:
    driver: bridge