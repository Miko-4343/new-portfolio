version: "3.9"

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./portfolio/dist:/usr/share/nginx/html   # <-- SPA build
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - gallery
      - backend
    networks:
      - webnet

  gallery:
    build: ./gallery
    container_name: gallery
    restart: always
    expose:
      - "3000"
    networks:
      - webnet

networks:
  webnet:
    driver: bridge